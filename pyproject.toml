[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inoue-ai-content-downloader"
version = "0.1.0"
description = "Async Python SDK to download social media content (YouTube, TikTok, Instagram) and upload to S3"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Inoue AI" }]
keywords = ["youtube", "tiktok", "instagram", "downloader", "s3", "async", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "yt-dlp>=2024.12.0",
    "instagrapi>=2.1.0",
    "aioboto3>=13.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "aiofiles>=23.2.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "brotli>=1.2.0",
    "noble-tls>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "moto[s3]>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/inoue-ai/Inoue-AI-Content-Downloader-SDK"
Repository = "https://github.com/inoue-ai/Inoue-AI-Content-Downloader-SDK"
Issues = "https://github.com/inoue-ai/Inoue-AI-Content-Downloader-SDK/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/inoue_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: end-to-end tests that hit real APIs (deselect with -m 'not e2e')"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "ASYNC230",  # open() in async - we use it for S3 upload_fileobj which expects a sync file object
    "ASYNC240",  # pathlib in async - quick fs ops (mkdir, exists) are fine without trio/anyio
    "B027",      # empty methods in ABC without @abstractmethod - intentional optional overrides
]

[tool.ruff.lint.isort]
known-first-party = ["inoue_downloader"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
